
[workspace]
resolver = "2"
members = ["wire", "wire-cli", "wire-app"]

[workspace.package]
authors = ["Frando <franz@n0.computer>", "n0 team"]
repository = "https://github.com/stardive/wire.git"
license = "MIT OR Apache-2.0"

# Focused lint policy. Every member inherits this table with
# `[lints] workspace = true`.
#
# These guard against avoidable panic and error-handling mistakes. They are a
# small, high-signal set, not the whole `restriction`/`pedantic` groups. Test
# code may still use `unwrap`/`expect` (see `clippy.toml`).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Async/lock/future correctness: never hold a guard or drop a future across an
# `.await` point.
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
let_underscore_future = "deny"

[patch.crates-io]
# make receive flows close on connection close: https://github.com/n0-computer/iroh-roq/pull/4
iroh-roq = { git = "https://github.com/n0-computer/iroh-roq.git", branch = "fix/close-flows" }

# fix android device names: https://github.com/RustAudio/cpal/pull/959
cpal = { git = "https://github.com/Frando/cpal.git", branch = "feat/android-device-name" }

# this is needed for compiling to wasm
# webrtc-util = { git = "https://github.com/Frando/webrtc.git", branch = "fix/util-feature-flags" }
